name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    name: Build and lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Temurin JDK 27.0.1.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/temurin-27.0.1.1+4.tar.gz"
          java_home="$RUNNER_TEMP/jdk-27.0.1.1+4"
          curl --fail --location --silent --show-error --retry 3 --output "$archive" \
            'https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.1%2B4/OpenJDK27U-jdk_x64_linux_hotspot_27.0.1.1_4.tar.gz'
          printf '%s  %s\n' '005e57ee860978acfeeff1be2b30f770664fe2b941e9b803c61c76992086d107' "$archive" | sha256sum --check --strict
          mkdir -p "$java_home"
          tar --extract --gzip --file "$archive" --directory "$java_home" --strip-components=1
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
          printf '%s\n' "$java_home/bin" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-37.0' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Build debug APK and run lint
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openiv-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
